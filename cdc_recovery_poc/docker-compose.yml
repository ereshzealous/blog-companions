# CDC failure-recovery lab: PostgreSQL -> Debezium (Kafka Connect, 2 workers) -> Kafka -> replay-safe sink -> ClickHouse.
# Credentials come from .env, generated by scripts/init-env.sh. Nothing secret is committed.
name: cdc-lab

x-tools: &tools
  build: ./lab
  image: cdc-lab/tools:local
  env_file: .env
  volumes:
    - ./results:/results
    - ./control:/control
    - ./connect:/connect:ro
    - ./lab:/lab:ro
  networks: [lab]

x-connect-env: &connect-env
  BOOTSTRAP_SERVERS: kafka:9092
  GROUP_ID: cdc-connect
  CONFIG_STORAGE_TOPIC: _connect_configs
  OFFSET_STORAGE_TOPIC: _connect_offsets
  STATUS_STORAGE_TOPIC: _connect_status
  CONFIG_STORAGE_REPLICATION_FACTOR: 1
  OFFSET_STORAGE_REPLICATION_FACTOR: 1
  STATUS_STORAGE_REPLICATION_FACTOR: 1
  KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
  CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
  # Stated explicitly because the lab measures their effect.
  CONNECT_OFFSET_FLUSH_INTERVAL_MS: ${CONNECT_OFFSET_FLUSH_INTERVAL_MS}
  CONNECT_SCHEDULED_REBALANCE_MAX_DELAY_MS: ${CONNECT_SCHEDULED_REBALANCE_MAX_DELAY_MS}
  # Secrets are resolved by the worker at runtime: "${env:CDC_CAPTURE_PASSWORD}" in the connector config.
  CONNECT_CONFIG_PROVIDERS: env
  CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  CONNECT_PRODUCER_LINGER_MS: 10
  CONNECT_PRODUCER_BATCH_SIZE: 524288
  CONNECT_PRODUCER_COMPRESSION_TYPE: lz4
  HEAP_OPTS: -Xms256m -Xmx448m
  CDC_CAPTURE_PASSWORD: ${CDC_CAPTURE_PASSWORD}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_DB: devices
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      CDC_CAPTURE_PASSWORD: ${CDC_CAPTURE_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD}
      SEED_REGISTRY_ROWS: ${SEED_REGISTRY_ROWS}
      SEED_STATUS_ROWS: ${SEED_STATUS_ROWS}
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
      -c max_wal_size=2GB
      -c shared_buffers=256MB
      -c checkpoint_timeout=5min
    shm_size: 256m
    mem_limit: 700m
    volumes:
      - pg-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d devices"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [lab]

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms400m -Xmx400m
    mem_limit: 800m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 60
    networks: [lab]

  connect-1:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION}
    hostname: connect-1
    mem_limit: 900m
    environment:
      <<: *connect-env
      ADVERTISED_HOST_NAME: connect-1
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [lab]

  connect-2:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION}
    hostname: connect-2
    mem_limit: 900m
    environment:
      <<: *connect-env
      ADVERTISED_HOST_NAME: connect-2
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [lab]

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    environment:
      CLICKHOUSE_DB: cdc
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_SINK_PASSWORD: ${CLICKHOUSE_SINK_PASSWORD}
    mem_limit: 1400m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/low-memory.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user lab --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [lab]

  # Two sink processes share one consumer group: parallelism comes from Kafka partitions, not from capture.
  sink:
    <<: *tools
    command: ["python", "-u", "sink.py"]
    deploy: { replicas: 2 }
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  collector:
    <<: *tools
    command: ["python", "-u", "collector.py"]
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }

  generator:
    <<: *tools
    command: ["python", "-u", "generator.py"]
    mem_limit: 320m
    environment:
      GENERATOR_WORKERS: ${GENERATOR_WORKERS}
    profiles: [load]
    depends_on:
      postgres: { condition: service_healthy }

  # Long-lived container for connector control, reconciliation and reports.
  tools:
    <<: *tools
    command: ["sleep", "infinity"]
    mem_limit: 256m
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  pg-data:
  ch-data:

networks:
  lab:
