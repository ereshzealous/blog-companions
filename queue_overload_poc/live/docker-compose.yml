# Tier 2 live lab: a real Kafka topic, a real consumer group, a real PostgreSQL
# write path with a bounded pool. Scaled down from the article's rates — the job
# is to reproduce the SHAPE on real software, not to benchmark anything.
name: queue-overload-lab

x-app: &app
  build: .
  environment: &env
    BOOTSTRAP: "kafka:9092"
    TOPIC: "orders"
    GROUP: "fulfilment"
    DSN: "postgresql://postgres:lab@postgres:5432/fulfilment"
    C_STAR: "8"                 # the dependency's useful concurrency
    SERVICE_MS: "25"            # time one fulfilment write holds a slot

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # LogAppendTime would measure broker residence. The lab carries its own
      # enqueued_at in the payload instead, so age is end-to-end queue delay and
      # the clock it uses is stated rather than assumed.
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: CreateTime
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: lab, POSTGRES_DB: fulfilment }
    command: postgres -c max_connections=200
    volumes: [ "./init.sql:/docker-entrypoint-initdb.d/init.sql:ro" ]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "fulfilment"]
      interval: 2s
      retries: 30

  # Proves the cluster is reachable before any run starts. The load generator
  # creates a fresh topic per run itself, so nothing is pre-created here.
  # command is a single-element list: a folded string would be word-split by
  # compose and `sh -c` would receive the flags as positional arguments.
  setup:
    image: apache/kafka:3.8.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null
        echo "broker reachable"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  runner:
    <<: *app
    profiles: [ tools ]
    environment:
      <<: *env
    depends_on:
      kafka:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
      setup:     { condition: service_completed_successfully }
