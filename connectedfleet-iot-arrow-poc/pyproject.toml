[project]
name = "connectedfleet-iot-arrow-poc"
version = "0.1.0"
description = "ConnectedFleet: where Apache Arrow helps (and does not) in a Kafka/Debezium/ClickHouse IoT pipeline"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
dependencies = [
    "pyarrow==25.0.1",
    "confluent-kafka==2.15.1",
    "clickhouse-connect==1.8.0",
    "psycopg[binary]==3.3.5",
    "pymongo==4.18.1",
    "PyYAML==6.0.3",
    "psutil==7.2.2",  # Lab 03 host-load guard (hostload.HostCpu)
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "jsonschema==4.26.0",
]
# Optional Lab 03 E5 interoperability experiment: `uv sync --group interop`
interop = [
    "polars==1.44.2",
    "duckdb==1.5.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectedfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the Docker Compose stack (Lab 02+); excluded from `make test`",
    "slow: larger fixtures; excluded from `make test`",
]
