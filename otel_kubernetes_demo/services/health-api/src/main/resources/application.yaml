server:
  port: 8080

spring:
  datasource:
    url: ${PG_URL:jdbc:postgresql://postgres.infra.svc.cluster.local:5432/wearable}
    username: ${PG_USER:wearable}
    password: ${PG_PASSWORD:wearable}
    hikari:
      maximum-pool-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
