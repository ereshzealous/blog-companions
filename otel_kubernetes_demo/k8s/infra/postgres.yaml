apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: infra
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
      id           UUID PRIMARY KEY,
      email        TEXT NOT NULL UNIQUE,
      created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      emergency_contact TEXT
    );

    CREATE TABLE IF NOT EXISTS devices (
      id           UUID PRIMARY KEY,
      user_id      UUID NOT NULL REFERENCES users(id),
      model        TEXT NOT NULL,
      firmware     TEXT NOT NULL,
      last_seen    TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_devices_user ON devices(user_id);

    CREATE TABLE IF NOT EXISTS vitals_rollup_1min (
      user_id      UUID NOT NULL,
      ts           TIMESTAMPTZ NOT NULL,
      hr_avg       REAL,
      hr_min       REAL,
      hr_max       REAL,
      spo2_avg     REAL,
      steps        INT,
      motion_class TEXT,
      PRIMARY KEY (user_id, ts)
    );
    CREATE INDEX IF NOT EXISTS idx_vitals_1min_ts ON vitals_rollup_1min(ts);

    CREATE TABLE IF NOT EXISTS vitals_rollup_1hour (
      user_id      UUID NOT NULL,
      ts           TIMESTAMPTZ NOT NULL,
      hr_avg       REAL,
      spo2_avg     REAL,
      steps        INT,
      PRIMARY KEY (user_id, ts)
    );

    CREATE TABLE IF NOT EXISTS events (
      id           UUID PRIMARY KEY,
      user_id      UUID NOT NULL,
      type         TEXT NOT NULL,
      severity     TEXT NOT NULL,
      ts           TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      payload      JSONB
    );
    CREATE INDEX IF NOT EXISTS idx_events_user_ts ON events(user_id, ts DESC);

    CREATE TABLE IF NOT EXISTS alerts (
      id              UUID PRIMARY KEY,
      user_id         UUID NOT NULL,
      event_id        UUID REFERENCES events(id),
      status          TEXT NOT NULL DEFAULT 'open',
      created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      acknowledged_at TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_alerts_user_status ON alerts(user_id, status);

    CREATE TABLE IF NOT EXISTS workouts (
      id           UUID PRIMARY KEY,
      user_id      UUID NOT NULL,
      type         TEXT NOT NULL,
      start_ts     TIMESTAMPTZ NOT NULL,
      end_ts       TIMESTAMPTZ,
      hr_avg       REAL,
      distance_m   REAL,
      calories     REAL
    );

    CREATE TABLE IF NOT EXISTS insights_daily (
      user_id        UUID NOT NULL,
      day            DATE NOT NULL,
      sleep_score    INT,
      recovery_score INT,
      readiness      INT,
      summary        TEXT,
      PRIMARY KEY (user_id, day)
    );

    -- Seed a few users so loadgen has something to push for
    INSERT INTO users (id, email, emergency_contact) VALUES
      ('11111111-1111-1111-1111-111111111111','alice@example.com','+1-555-0001'),
      ('22222222-2222-2222-2222-222222222222','bob@example.com','+1-555-0002'),
      ('33333333-3333-3333-3333-333333333333','carol@example.com','+1-555-0003')
    ON CONFLICT (id) DO NOTHING;

    INSERT INTO devices (id, user_id, model, firmware) VALUES
      ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa','11111111-1111-1111-1111-111111111111','Watch S1','1.2.0'),
      ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb','22222222-2222-2222-2222-222222222222','Ring R2','2.0.1'),
      ('cccccccc-cccc-cccc-cccc-cccccccccccc','33333333-3333-3333-3333-333333333333','Band B3','1.5.3')
    ON CONFLICT (id) DO NOTHING;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infra
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: infra
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: wearable
            - name: POSTGRES_USER
              value: wearable
            - name: POSTGRES_PASSWORD
              value: wearable
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wearable", "-d", "wearable"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
