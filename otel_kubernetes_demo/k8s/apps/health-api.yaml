apiVersion: v1
kind: Service
metadata:
  name: health-api
  namespace: wearable
spec:
  selector:
    app: health-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-api
  namespace: wearable
  labels:
    app: health-api
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-api
  template:
    metadata:
      labels:
        app: health-api
        app.kubernetes.io/version: "0.1.0"
    spec:
      containers:
        - name: health-api
          image: wearable/health-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PG_URL
              value: "jdbc:postgresql://postgres.infra.svc.cluster.local:5432/wearable"
            - name: PG_USER
              value: "wearable"
            - name: PG_PASSWORD
              value: "wearable"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(NODE_IP):4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "health-api"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=health-api,service.version=0.1.0"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_JAVAAGENT_LOGGING
              value: "simple"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
